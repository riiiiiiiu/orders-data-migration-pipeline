
version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: fct_order_sales
    columns:
      - name: line_total
        data_tests:
          - not_null
  
  - name: mart_customer_sales
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: total_orders
        data_tests:
          - not_null
      - name: total_units_purchased
        data_tests:
          - not_null
      - name: total_sales
        data_tests:
          - not_null
